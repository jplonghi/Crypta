name: Crypta checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crypta-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS build and tests
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify build environment
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          swift --version
      - name: Test vault engine
        run: swift test --force-resolved-versions --package-path Packages/CryptaCore
      - name: Test desktop presentation
        run: swift test --force-resolved-versions
      - name: Test engine with Address Sanitizer
        run: swift test --force-resolved-versions --package-path Packages/CryptaCore --scratch-path /tmp/crypta-asan-core --sanitize address
      - name: Test desktop with Address Sanitizer
        run: swift test --force-resolved-versions --scratch-path /tmp/crypta-asan-desktop --sanitize address
      - name: Exercise parser mutations
        run: CRYPTA_FUZZ_ASAN=1 bash Scripts/fuzz.sh 20000
      - name: Package Release app and verify signature
        run: bash Scripts/package-release.sh
